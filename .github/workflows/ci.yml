name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Installer smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run installer smoke test
        run: node installer/test/smoke.test.js

  hook:
    name: Version-bump hook test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run hook test
        run: bash scripts/test-hook.sh
